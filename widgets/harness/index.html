<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>openbaud widget harness</title>
    <link rel="icon" href="data:," />
    <style>
      /* Fixture chrome only — neutral system colors, no palette of its own. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.35);
      }
      header .title {
        font-weight: 700;
        margin-right: 8px;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 4px 8px;
      }
      #app-url {
        min-width: 260px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }
      main {
        display: grid;
        grid-template-columns: minmax(360px, 780px) 1fr;
        gap: 12px;
        padding: 12px 14px;
        align-items: start;
      }
      #frame {
        width: 100%;
        height: 640px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 8px;
        background: transparent;
      }
      #log {
        margin: 0;
        height: 640px;
        overflow: auto;
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-all;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(128, 128, 128, 0.08);
      }
      label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">openbaud widget harness</span>
      <input id="app-url" type="text" spellcheck="false" />
      <button id="load" type="button">Load</button>
      <label>
        scenario
        <select id="scenario">
          <option value="ask_port">ask_port (9 candidates)</option>
          <option value="show_result">show_result (file → resource, view)</option>
          <option value="show_result_inline">show_result (inline data, view)</option>
          <option value="show_result_encoded">show_result (encoding, foreign fields)</option>
          <option value="show_result_broken">show_result (view misses its field)</option>
          <option value="show_result_undeclared">show_result (nothing declared → KV)</option>
          <option value="show_result_timeline">show_result (timeline, file → resource)</option>
          <option value="show_result_diagnostics">show_result (diagnostics, inline)</option>
          <option value="show_result_capture">show_result (capture, file → resource)</option>
          <option value="show_result_replay">show_result (replay port → watermark)</option>
          <option value="show_result_scope">show_result (live scope, 2 series)</option>
          <option value="show_result_scope_dropped">show_result (live scope, dropped frames)</option>
          <option value="show_result_scope_parse_error">show_result (live scope, parse errors)</option>
          <option value="show_result_scope_flaky">show_result (live scope, flaky poll → retry)</option>
          <option value="show_result_heatmap">show_result (live heatmap 8×8)</option>
          <option value="show_result_stream_bad">show_result (bad stream descriptor)</option>
          <option value="tool_cancelled">tool-cancelled (input, no result)</option>
        </select>
      </label>
      <label>
        update-model-context →
        <select id="ctx-mode">
          <option value="ok">accept</option>
          <option value="reject">reject</option>
        </select>
      </label>
      <label>
        resources/read →
        <select id="resource-mode">
          <option value="ok">success</option>
          <option value="slow">slow (2.5 s)</option>
          <option value="fail">not found</option>
        </select>
      </label>
      <button id="send-scenario" type="button">Send tool-input + result</button>
      <button id="next-result" type="button">Next saved result</button>
      <button id="toggle-theme" type="button">Toggle theme</button>
    </header>
    <main>
      <!-- allow-same-origin is intentional for this dev harness: the widget is
           served from the same Vite origin, and same-origin lets its module
           scripts and HMR work. A real MCP Apps host serves the widget from an
           isolated origin and sandboxes with allow-scripts only — do not treat
           this combination as a model of production isolation. -->
      <iframe id="frame" title="widget under test" sandbox="allow-scripts allow-same-origin"></iframe>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
