schema: openbaud/command@v0
name: obp1_radar_scan
description: >-
  Request one CRC-protected OBP/1 radar frame and decode its 36 polar points.
  The included capture is from a real ESP32-S3; simulated_scene=1 identifies
  that the radar scene itself is generated by the demo firmware.
risk: read
params:
  - { name: seq, type: u16le, default: 42, min: 0, max: 65535, description: Host sequence echoed by the board }
frame: { hex: "4F 42 01 01 {seq} 00 00 {crc16_modbus}" }
response:
  match: { length: 196 }
  timeout_ms: 4000
  validate: { checksum: crc16_modbus }
  parse:
    fields:
      magic: { at: 0, type: u16be }
      version: { at: 2, type: u8 }
      kind: { at: 3, type: u8 }
      seq: { at: 4, type: u16le }
      total_len: { at: 6, type: u16le, unit: bytes }
      uptime_ms: { at: 8, type: u32le, unit: ms }
      point_count: { at: 12, type: u8 }
      simulated_scene: { at: 13, type: u8, bits: { lsb: 0, width: 1 } }
      points:
        at: 14
        count: { field: point_count }
        stride: 5
        elements:
          angle_deg: { at: 0, type: u16le, scale: 0.01, unit: deg }
          distance_mm: { at: 2, type: u16le, unit: mm }
          intensity: { at: 4, type: u8 }
provenance:
  datasheet: "../../protocol.md"
  verified:
    capture: "captures/obp1-radar-seq42.obcap"
    note: "Real ESP32-S3 returned 196 bytes; CRC passed; 36 records parsed; simulated_scene=1."
    date: 2026-08-24
