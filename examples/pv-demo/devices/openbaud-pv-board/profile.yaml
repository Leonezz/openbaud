schema: openbaud/profile@v0
name: openbaud-pv-board
description: >-
  Real ESP32-S3 development board running the OBP/1 public-demo firmware. USB
  transport and frames are real. Radar points are generated by the test
  firmware and identified by response flag simulated_scene=1.
transport: { baud: 115200, data_bits: 8, parity: none, stop_bits: 1 }
framing: { idle_ms: 100 }
selector: { vid: "303A", pid: "1001" }
