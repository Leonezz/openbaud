[package]
name = "openbaud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serial-port capability layer and knowledge format for coding agents"

[lib]
name = "openbaud"
path = "src/lib.rs"

[[bin]]
name = "openbaud"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
openbaud-core = { path = "../openbaud-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "fs"] }
tokio-serial = "5.4"
