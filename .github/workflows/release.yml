name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify source and tag
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python3 scripts/validate-package.py --tag "$GITHUB_REF_NAME"

  build-plugin:
    name: Build ${{ matrix.platform }} plugin
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: darwin-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widgets/pnpm-lock.yaml
      - name: Build bundled runtime
        shell: bash
        run: plugins/openbaud/scripts/build-runtime
      - name: Package platform plugin
        shell: bash
        run: |
          python3 scripts/package-plugin.py \
            --platform "${{ matrix.platform }}" \
            --tag "$GITHUB_REF_NAME" \
            --output-dir dist-assets
      - name: Verify packaged plugin
        shell: bash
        run: |
          mkdir -p dist-verify
          archive="dist-assets/openbaud-codex-plugin-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz"
          tar -xzf "$archive" -C dist-verify
          python3 scripts/validate-package.py \
            --package-root "dist-verify/openbaud-${GITHUB_REF_NAME}-${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}"
          dist-verify/openbaud-${GITHUB_REF_NAME}-${{ matrix.platform }}/plugins/openbaud/scripts/smoke-test
          python3 - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          expected, filename = archive.with_name(archive.name + ".sha256").read_text().split()
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if filename != archive.name or actual != expected:
              raise SystemExit("release archive checksum mismatch")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Assemble and smoke test universal marketplace plugin
        run: |
          python3 scripts/package-plugin.py \
            --platform universal \
            --tag "$GITHUB_REF_NAME" \
            --input-dir dist \
            --output-dir dist
          mkdir -p dist-universal-verify
          archive="dist/openbaud-codex-plugin-${GITHUB_REF_NAME}-universal.tar.gz"
          tar -xzf "$archive" -C dist-universal-verify
          python3 scripts/validate-package.py \
            --package-root "dist-universal-verify/openbaud-${GITHUB_REF_NAME}-universal" \
            --platform universal
          dist-universal-verify/openbaud-${GITHUB_REF_NAME}-universal/plugins/openbaud/scripts/smoke-test
      - name: Verify release assets
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib

          root = pathlib.Path("dist")
          platforms = (
              "darwin-arm64",
              "darwin-x64",
              "linux-x64",
              "linux-arm64",
              "windows-x64",
              "universal",
          )
          expected_names = set()
          for platform in platforms:
              name = f"openbaud-codex-plugin-${{ github.ref_name }}-{platform}.tar.gz"
              expected_names.update((name, name + ".sha256"))
              archive = root / name
              checksum = root / (name + ".sha256")
              expected, recorded_name = checksum.read_text().split()
              if recorded_name != name:
                  raise SystemExit(f"unexpected checksum filename: {recorded_name}")
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"checksum mismatch: {name}")
          actual_names = {path.name for path in root.iterdir() if path.is_file()}
          if actual_names != expected_names:
              raise SystemExit(f"unexpected release assets: {sorted(actual_names ^ expected_names)}")
          PY
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "OpenBaud ${GITHUB_REF_NAME}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish universal plugin to stable marketplace channel
        run: |
          bundle_parent=$(mktemp -d)
          channel_worktree=$(mktemp -d)
          archive="dist/openbaud-codex-plugin-${GITHUB_REF_NAME}-universal.tar.gz"
          tar -xzf "$archive" -C "$bundle_parent"
          bundle_root="$bundle_parent/openbaud-${GITHUB_REF_NAME}-universal"

          if git ls-remote --exit-code origin refs/heads/stable >/dev/null 2>&1; then
            git fetch --depth=1 origin refs/heads/stable:refs/remotes/origin/stable
            git worktree add -b stable-publish "$channel_worktree" refs/remotes/origin/stable
          else
            git worktree add --detach "$channel_worktree" "$GITHUB_SHA"
            git -C "$channel_worktree" switch --orphan stable-publish
          fi
          rsync -a --delete --exclude=.git "$bundle_root"/ "$channel_worktree"/
          git -C "$channel_worktree" add -A
          if git -C "$channel_worktree" diff --cached --quiet; then
            echo "stable marketplace already contains ${GITHUB_REF_NAME}"
          else
            git -C "$channel_worktree" \
              -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "release: publish stable marketplace ${GITHUB_REF_NAME}"
          fi
          git push origin HEAD:refs/heads/stable
