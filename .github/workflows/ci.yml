name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Validate Skill and plugin package
        run: python3 scripts/validate-package.py

  plugin-smoke:
    name: macOS ARM64 plugin smoke test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Confirm runner architecture
        run: test "$(uname -m)" = arm64
      - name: Verify committed plugin
        run: |
          python3 scripts/validate-package.py
          plugins/openbaud/scripts/smoke-test
          cd plugins/openbaud/bin/darwin-arm64
          shasum -a 256 -c openbaud.sha256
          codesign --verify --strict --verbose=2 openbaud
      - name: Build bundled runtime
        run: plugins/openbaud/scripts/build-runtime
      - name: Verify rebuilt plugin
        run: |
          python3 scripts/validate-package.py
          plugins/openbaud/scripts/smoke-test
          cd plugins/openbaud/bin/darwin-arm64
          shasum -a 256 -c openbaud.sha256
          codesign --verify --strict --verbose=2 openbaud
