name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Validate Skill and plugin package
        run: python3 scripts/validate-package.py

  widgets:
    name: Widget checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widgets/pnpm-lock.yaml
      - name: Install widget dependencies
        working-directory: widgets
        run: pnpm install --frozen-lockfile
      - name: Typecheck widgets
        working-directory: widgets
        run: pnpm typecheck
      - name: Build widgets
        working-directory: widgets
        run: pnpm build

  platform-build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: darwin-arm64
            os: macos-14
          - name: macOS Intel
            platform: darwin-x64
            os: macos-15-intel
          - name: Linux x64
            platform: linux-x64
            os: ubuntu-latest
          - name: Linux ARM64
            platform: linux-arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            platform: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widgets/pnpm-lock.yaml
      - name: Compile and test workspace
        shell: bash
        run: cargo test --workspace --locked
      - name: Build bundled runtime
        shell: bash
        run: plugins/openbaud/scripts/build-runtime
      - name: Package and smoke test platform plugin
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(cargo["workspace"]["package"]["version"])
          PY
          )
          tag="v$version"
          python3 scripts/package-plugin.py \
            --platform "${{ matrix.platform }}" \
            --tag "$tag" \
            --output-dir dist-assets
          mkdir -p dist-verify
          archive="dist-assets/openbaud-codex-plugin-${tag}-${{ matrix.platform }}.tar.gz"
          tar -xzf "$archive" -C dist-verify
          dist-verify/openbaud-${tag}-${{ matrix.platform }}/plugins/openbaud/scripts/smoke-test
